    <script>
        const cursor = document.querySelector('.custom-cursor');
        const navLinks = document.querySelectorAll('nav ul li a');
        const menuToggle = document.querySelector('.menu-toggle');
        const navMenu = document.querySelector('nav ul');
    
        // Glowing cursor movement
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = `${e.clientX}px`;
            cursor.style.top = `${e.clientY}px`;
        });
    
        // Highlight Active Page
        navLinks.forEach(link => {
            let linkPath = link.href.split("/").pop(); // Get filename from link
            let currentPath = window.location.pathname.split("/").pop(); // Get current file
    
            // Handle index.html or root case
            if (currentPath === "" || currentPath === "index.html") {
                currentPath = "index.html";
            }
    
            if (linkPath === currentPath) {
                link.classList.add("active");
            }
        });
    
        // Toggle mobile menu
        menuToggle.addEventListener("click", () => {
            navMenu.classList.toggle("show");
        });

        // Smooth transition effect when clicking a link
  navLinks.forEach(link => {
        link.addEventListener("click", function (e) {
            e.preventDefault(); // Prevent instant navigation
            document.body.classList.add("fade-out"); // Trigger fade-out effect
            setTimeout(() => {
                window.location.href = this.href; // Navigate after animation
            }, 500); // Wait for fade-out before loading next page
        });
    });
        

    </script>
